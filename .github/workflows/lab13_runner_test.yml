
name: Lab 13 - Adult Income Self Hosted Runner Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check Python
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          python --version

          if ($LASTEXITCODE -ne 0) {
              throw "Python is not available."
          }

      - name: Check Git
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          git --version

          if ($LASTEXITCODE -ne 0) {
              throw "Git is not available."
          }

      - name: Check Docker
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          docker info

          if ($LASTEXITCODE -ne 0) {
              throw "Docker is not available or not running."
          }

      - name: Check Kubernetes
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          kubectl get nodes

          if ($LASTEXITCODE -ne 0) {
              throw "Kubernetes is not available."
          }

      - name: Check Adult Income Project
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force

          $ProjectRoot = "C:\Users\surya\Downloads\Btech\ドキュメント\MLOPS\adult-income-prediction"

          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Project: $ProjectRoot"

          if (!(Test-Path $ProjectRoot)) {
              throw "Adult Income project folder not found."
          }

          $Python = Join-Path $ProjectRoot ".venv311\Scripts\python.exe"

          if (!(Test-Path $Python)) {
              throw "Project Python environment not found: $Python"
          }

          & $Python --version

          if ($LASTEXITCODE -ne 0) {
              throw "Project Python execution failed."
          }

          $Script = Join-Path $ProjectRoot "src\lab12_monitor_trigger.py"

          if (!(Test-Path $Script)) {
              throw "Adult Income monitoring script not found."
          }

          $Report = Join-Path $ProjectRoot "outputs\monitoring\lab12_monitor_trigger_report.json"

          if (!(Test-Path $Report)) {
              throw "Adult Income monitoring report not found."
          }

          Write-Host "Adult Income project structure verified successfully."

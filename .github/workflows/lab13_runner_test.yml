
name: Lab 13 - Adult Income Self Hosted Runner Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Checkout Adult Income Project
        uses: actions/checkout@v4

      - name: Check Python
        shell: powershell
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) {
              throw "Python is not available."
          }

      - name: Check Git
        shell: powershell
        run: |
          git --version
          if ($LASTEXITCODE -ne 0) {
              throw "Git is not available."
          }

      - name: Check Docker
        shell: powershell
        run: |
          docker info
          if ($LASTEXITCODE -ne 0) {
              throw "Docker is not available or not running."
          }

      - name: Check Kubernetes
        shell: powershell
        run: |
          kubectl get nodes
          if ($LASTEXITCODE -ne 0) {
              throw "Kubernetes is not available."
          }

      - name: Check Adult Income Project
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

          $ProjectRoot = $env:GITHUB_WORKSPACE

          if (!(Test-Path $ProjectRoot)) {
              throw "GitHub workspace not found."
          }

          $Script = Join-Path $ProjectRoot "src\lab12_monitor_trigger.py"

          if (!(Test-Path $Script)) {
              throw "Monitoring script not found."
          }

          Write-Host "Adult Income project structure verified."
          Write-Host "GitHub workspace verification completed."


apiVersion: apps/v1
kind: Deployment

metadata:
  name: adult-income-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: adult-income

  template:
    metadata:
      labels:
        app: adult-income

    spec:
      containers:
        - name: adult-income-container
          image: adult-income-api:2.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: adult-income-logs
              mountPath: /app/logs

      volumes:
        - name: adult-income-logs
          persistentVolumeClaim:
            claimName: adult-income-logs-pvc
